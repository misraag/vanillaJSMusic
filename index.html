<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./public/logo.png">


    <!-- FONTS  -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Dancing+Script:wght@400..700&family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">


    
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <!--CSS FILES -->
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/nav.css" />
    <link rel="stylesheet" href="styles/midsection.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/modal.css" />


    <title>Vanilla Player</title>
</head>


<body>
    <div id="dom">
        
        <!--SECTION:1 - NAVBAR -------------------------------------------------------------->
        <div id="navbar">
            <div class="leftSection">
                <div class="logoSection">
                    <div class="navTile"><i class="fa-solid fa-bars"></i><div class="websiteLogo"><i class="fa-solid fa-ice-cream"></i><span class="websiteName">Vanilla</span></div></div>
                </div>
            </div>  
            
            <div class="rightSection searchSection">
                <div class="searchRightSection">
                    <input type="text" placeholder="Search songs, albums, artists" class="searchBar">
                </div>
            </div>
        </div>






        

        <!--SECTION:2- MID SECTION CONTAINING LEFT MID AND RIGHT SECTIONS -------------------------->
        <div id="midsection">
            <div id="libraries" class="leftSection">
                <div class="tileSection">
                    <div id="homeLibrary" class="tile"><i class="fa-solid fa-house"></i>Home</div>
                    <div id="explore" class="tile"><i class="fa-solid fa-compass"></i>Explore</div>
                    <div id="library" class="tile"><i class="fa-solid fa-bookmark"></i>Library</div>

                </div>
                <div class="dynamicSection">
                    <div id="createPlaylist">+ New Playlist</div>
                    <div id="dynamicPlaylist">
                       <div class="dynamicTile">
                        <span class="dynamicPlaylistName">Liked</span>
                        <span class="dynamicPlaylistCategory">Gym</span>
                       </div>
                    </div>
                </div>
            </div>
            <div id="songs" class="rightSection">
                <div class="songsRightSection">
                    <div class="container-fluid px-4 mt-4">
                        <button id="backBtn" class="hidden"><i class="fa-solid fa-arrow-left"></i></button>
                        <div id="songGrid" class="row g-3">
                            <!-- Cards injected here -->
                        </div>
                    </div>

                        <audio id="audioPlayer"></audio>

                </div>
            </div>
        </div>









        <!--SECTION3: CONTROL SECTION ----------------------------------------------------->
        <div id="footer">
            <div class="leftSection controlSection">
                <div class="controlButtons">
                    <i class="fas fa-2x fa-step-backward" id="previous"></i>
                    <i class="fa-solid fa-play controlPlayButton"></i>
                    <i class="fas fa-2x fa-step-forward" id="next"></i>
                </div>
                <div class="songTimer">
                    3:48/4:15
                </div>
                
            </div>
            <div class="rightSection songInfo">
                <div class="footerRightSection">
                    <div id="progressBar">                       
                            <div id="seekBar" class="progress" id="progress"></div>
                    </div>
                    <div id="currentSongControls">
                        <div class="songDetails">
                            <div class="songImage"><img src="covers/Tere Naina.jpg" alt="Unable"></div>
                            <div class="songName">
                                <div class="songTitle">Tere Naina</div>
                                <div class="songDescription">Shankar–Ehsaan–Loy, Shafqat Amanat Ali | My Name Is Khan | Hindi</div>
                            </div>
                            <i class="fa-solid fa-ellipsis-vertical" id="footerMenu"></i>
                        </div>
                        <div class="volumeSection">
                            <input
                                id="myVolumeBar"
                                type="range"
                                class="volumeProgressBar"
                                min="0"
                                value="10"
                                max="100"                                
                            />
                            <i id="volumeIcon" class="fa-solid fa-volume-high"></i>
                            <i class="fa-solid fa-repeat"></i>
                        </div>
                    </div>
                </div>                
            </div>
        </div>



    <!-- MODAL SECTION FOR CREATING PLAYLIST -->
    <!-- PLAYLIST MODAL -->
            <div id="playlistModal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                    <span>Create Playlist</span>
                    </div>
                    <div class="modal-body">
                    <input id="playlistInput" type="text" placeholder="Playlist name..." />
                    </div>
                    <div class="modal-footer">
                    <button id="cancelPlaylist">Cancel</button>
                    <button id="savePlaylist">Save</button>
                    </div>
                </div>
            </div>



    <!-- MODAL FOR ADDING SONGS TO PLAYLIST -->
    <div id="addingSongsModal" class="modal hidden">
            <div class="modal-container">
                <div class="modal-header">
                    <span>Add to Playlist</span>
                </div>
                <div class="modal-body">
                    <div id="modalList"></div>
                </div>
                <div class="modal-footer">                
                    <button id="cancelAddingSongs">Cancel</button>
                    <button id="modalCreate">+ New Playlist</button>
                </div>          
            </div>
    </div>







    <!-- Javascript -->
        <!-- FontAwesomeIcons -->
        <script
        src="https://kit.fontawesome.com/bfe7c45ec2.js"
        crossorigin="anonymous"
        ></script>

    <script type="module" src="src/app.js"></script>
</body>


</html>
